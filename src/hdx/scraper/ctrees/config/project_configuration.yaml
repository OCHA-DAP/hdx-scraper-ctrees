# Collector specific configuration

# Public AWS Open Data S3 mirror of CTrees' annual global AGB COGs (no auth required)
agb_cog_url_template: "https://ctrees-agb-100m-global.s3.amazonaws.com/cogs/global_agb_100m_landsat0024_all_{year}_densenet_l1_agb_mosaic_100m_base_cd_ts.tif"
# agb/uncertainty pixel values are scaled by this factor; divide to get true Mg/ha
agb_scale_factor: 10
# Fill/nodata sentinel value in the source data. The public S3 COG mirror carries no GDAL NoData
# tag of its own (confirmed via gdalinfo), so this can't be read from the file -- it comes from
# the equivalent Zarr source's documented _FillValue attribute instead.
agb_fill_value: -9999
# How many years to search backwards from the current year for the latest published AGB COG
max_year_lookback: 5

# HDX dataset providing country admin boundaries, used to derive per-country clip bounding boxes
cod_ab_global_dataset_id: "cod-ab-global"
cod_ab_global_resource_name: "global_admin_boundaries_matched_latest.gdb.zip"
# Per-country COD boundaries for countries missing from cod-ab-global (fieldmaps has no jor, so
# it is skipped)
fieldmaps_cod_url_template: "https://data.fieldmaps.io/cod/originals/{iso3}.gpkg.zip"
# Countries too large to publish at the source's native 100m: integer downsample factor
downsample_factors:
  bra: 2

dataset_title_suffix: "Aboveground Biomass"
tags:
  - "climate-weather"
  - "environment"
  - "geodata"
